name: Publicar Development (Play Store interno + TestFlight)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Plataforma
        type: choice
        options: [all, android, ios]
        default: all

concurrency:
  group: eas-development
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: develop

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: vagare-app/yarn.lock

      - run: yarn install --frozen-lockfile
        working-directory: vagare-app

      - run: bash scripts/pr-checks.sh

  build-and-submit:
    needs: checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vagare-app
    steps:
      - uses: actions/checkout@v5
        with:
          ref: develop

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: vagare-app/yarn.lock

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: yarn
          token: ${{ secrets.EXPO_TOKEN }}

      - run: yarn install --frozen-lockfile

      # O build roda na nuvem do EAS; --no-wait libera o runner e o envio às
      # lojas acontece automaticamente no EAS quando o build termina.
      - name: Build e envio às lojas (internal / TestFlight)
        run: >
          eas build
          --platform ${{ inputs.platform || 'all' }}
          --profile development-store
          --auto-submit-with-profile development-store
          --non-interactive
          --no-wait
