name: Script no Pull Request

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  executar-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: vagare-app/yarn.lock

      - run: yarn install --frozen-lockfile
        working-directory: vagare-app

      - run: bash scripts/pr-checks.sh
