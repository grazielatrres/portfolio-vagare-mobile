name: Release

run-name: "Release ${{ (inputs.ambiente || 'production') }} · ${{ (inputs.plataforma || 'all') }}"

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ambiente:
        description: Ambiente (development = develop → Play interno + TestFlight · production = main → Play interno + TestFlight)
        type: choice
        options: [development, production]
        default: development
      plataforma:
        description: Plataforma
        type: choice
        options: [all, android, ios]
        default: all

concurrency:
  group: release-${{ (inputs.ambiente || 'production') }}
  cancel-in-progress: false

jobs:
  checks:
    name: Verificações (${{ (inputs.ambiente || 'production') == 'production' && 'main' || 'develop' }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ (inputs.ambiente || 'production') == 'production' && 'main' || 'develop' }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile

      - name: Lint, typecheck e testes
        run: bash scripts/pr-checks.sh

      - name: Resumo
        run: |
          {
            echo "## Release ${{ (inputs.ambiente || 'production') }}"
            echo
            echo "| Ambiente | Branch | Plataforma | Commit |"
            echo "|---|---|---|---|"
            echo "| ${{ (inputs.ambiente || 'production') }} | ${{ (inputs.ambiente || 'production') == 'production' && 'main' || 'develop' }} | ${{ (inputs.plataforma || 'all') }} | \`$(git rev-parse --short HEAD)\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  dev-android:
    name: Development · Android (Play interno)
    needs: checks
    if: (inputs.ambiente || 'production') == 'development' && (inputs.plataforma || 'all') != 'ios'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: develop
      - uses: ./.github/actions/eas-build-submit
        with:
          platform: android
          profile: development-store
          expo-token: ${{ secrets.EXPO_TOKEN }}

  dev-ios:
    name: Development · iOS (TestFlight)
    needs: checks
    if: (inputs.ambiente || 'production') == 'development' && (inputs.plataforma || 'all') != 'android'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: develop
      - uses: ./.github/actions/eas-build-submit
        with:
          platform: ios
          profile: development-store
          expo-token: ${{ secrets.EXPO_TOKEN }}

  prod-android:
    name: Produção · Android (Play interno)
    needs: checks
    if: (inputs.ambiente || 'production') == 'production' && (inputs.plataforma || 'all') != 'ios'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: production
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: ./.github/actions/eas-build-submit
        with:
          platform: android
          profile: production
          expo-token: ${{ secrets.EXPO_TOKEN }}

  prod-ios:
    name: Produção · iOS (TestFlight)
    needs: checks
    if: (inputs.ambiente || 'production') == 'production' && (inputs.plataforma || 'all') != 'android'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: production
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: ./.github/actions/eas-build-submit
        with:
          platform: ios
          profile: production
          expo-token: ${{ secrets.EXPO_TOKEN }}
