# SonarQube Cloud (SonarCloud) — análise estática, code smells, duplicação e segurança.
# Organização e chave seguem o padrão de import do GitHub no sonarcloud.io;
# ajuste se o projeto for criado com outros nomes.
sonar.organization=grazielatrres
sonar.projectKey=grazielatrres_portfolio-vagare-mobile
sonar.projectName=Vagare Mobile

sonar.sources=vagare-app/app,vagare-app/src
sonar.tests=vagare-app/tests
sonar.sourceEncoding=UTF-8

# Cobertura gerada pelo `yarn test:coverage` (scripts/pr-checks.sh).
sonar.javascript.lcov.reportPaths=vagare-app/coverage/lcov.info
