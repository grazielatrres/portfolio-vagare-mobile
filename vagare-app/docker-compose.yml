services:
  app:
    build: .
    container_name: vagare-app
    restart: unless-stopped
    ports:
      - '8081:8081'
    env_file:
      - .env
    environment:
      # IP da sua máquina na rede local (ex.: 192.168.0.10), para o Expo Go no celular
      # conseguir alcançar o Metro. Defina no .env; com "localhost" só o emulador/web funciona.
      REACT_NATIVE_PACKAGER_HOSTNAME: ${REACT_NATIVE_PACKAGER_HOSTNAME:-localhost}
    volumes:
      - .:/app
      - vagare_app_node_modules:/app/node_modules
    stdin_open: true
    tty: true

volumes:
  vagare_app_node_modules:
